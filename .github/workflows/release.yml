name: Build & Release System Artifact

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package app as zip artifact
        run: |
          mkdir -p dist
          zip -r "dist/solo-leveling-system-${GITHUB_REF_NAME:-manual}.zip" index.html README.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: solo-leveling-system
          path: dist/*.zip

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          
